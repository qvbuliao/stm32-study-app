<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  /* 安卓自适应图标：背景铺满整块，内容缩到 80% 安全区内（圆形裁切不会切到字） */
  html,body{margin:0;padding:0;overflow:hidden}
  .icon{position:relative;width:512px;height:512px;
    background:radial-gradient(120% 120% at 30% 20%,#1e2c3d 0%,#111820 58%,#0b1a29 100%);
    overflow:hidden}
  .glow{position:absolute;inset:0;
    background:radial-gradient(52% 48% at 50% 46%,rgba(78,161,255,.20),transparent 72%)}
  .chip{position:absolute;left:21%;top:21%;width:58%;height:58%;
    border:11px solid rgba(78,161,255,.26);border-radius:48px;box-sizing:border-box;
    background:rgba(78,161,255,.05)}
  .pins{position:absolute;left:15%;top:15%;width:70%;height:70%}
  .txt{position:absolute;left:0;right:0;top:36%;text-align:center;
    font:700 89px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#4ea1ff;
    letter-spacing:-3px;text-shadow:0 0 17px rgba(78,161,255,.75)}
  .sub{position:absolute;left:0;right:0;top:64%;text-align:center;
    font:600 22px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
    color:#9aa7b8;letter-spacing:6px;text-indent:6px}
</style></head>
<body>
<div class="icon">
  <div class="glow"></div>
  <div class="chip"></div>
  <svg class="pins" viewBox="0 0 100 100" preserveAspectRatio="none">
    <g stroke="#4ea1ff" stroke-width="2.8" stroke-linecap="round" opacity=".66">
      <line x1="30" y1="-6" x2="30" y2="6"/><line x1="42" y1="-6" x2="42" y2="6"/>
      <line x1="54" y1="-6" x2="54" y2="6"/><line x1="66" y1="-6" x2="66" y2="6"/>
      <line x1="30" y1="94" x2="30" y2="106"/><line x1="42" y1="94" x2="42" y2="106"/>
      <line x1="54" y1="94" x2="54" y2="106"/><line x1="66" y1="94" x2="66" y2="106"/>
      <line x1="-6" y1="30" x2="6" y2="30"/><line x1="-6" y1="42" x2="6" y2="42"/>
      <line x1="-6" y1="54" x2="6" y2="54"/><line x1="-6" y1="66" x2="6" y2="66"/>
      <line x1="94" y1="30" x2="106" y2="30"/><line x1="94" y1="42" x2="106" y2="42"/>
      <line x1="94" y1="54" x2="106" y2="54"/><line x1="94" y1="66" x2="106" y2="66"/>
    </g>
  </svg>
  <div class="txt">ST</div>
  <div class="sub">STM32</div>
</div>
</body></html>
