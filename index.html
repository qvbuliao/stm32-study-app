<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STM32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>STM32 五天速通 · [2-2]→[6-2]</title>
<style>
:root{
  --bg:#0e1117; --bg2:#151a23; --bg3:#1c2331; --line:#28303f;
  --fg:#e6edf3; --fg2:#9aa7b8; --fg3:#6b7788;
  --acc:#4ea1ff; --acc2:#2b6cb0; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Cascadia Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:16px;line-height:1.7;overscroll-behavior-y:none}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--acc);text-decoration:none}
b,strong{color:#fff}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:30;background:rgba(14,17,23,.92);
  backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.hd{display:flex;align-items:center;gap:10px}
.hd h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px;flex:1}
.hd .sub{font-size:11px;color:var(--fg3);display:block;font-weight:400;letter-spacing:0}
#pbar{height:3px;background:var(--bg3);border-radius:2px;margin-top:9px;overflow:hidden}
#pfill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .3s}
.chip{font-size:11px;color:var(--fg2);background:var(--bg3);border:1px solid var(--line);
  padding:3px 8px;border-radius:999px;white-space:nowrap}

/* ---------- 底部导航 ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(15,19,26,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--fg3);font-family:var(--sans);
  font-size:11px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--acc)}

/* ---------- 视图 ---------- */
main{padding:14px 14px 20px;max-width:820px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* ---------- 通用块 ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:17px}
h2{font-size:18px;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:15.5px;margin:18px 0 8px;color:var(--acc)}
h4{font-size:14.5px;margin:14px 0 6px;color:#fff}
p{margin:9px 0}
ul,ol{margin:8px 0;padding-left:20px}
li{margin:5px 0}
code{font-family:var(--mono);font-size:.88em;background:var(--bg3);
  padding:1.5px 5px;border-radius:5px;color:#ffd580;word-break:break-word}
pre{background:#0b0f16;border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;overflow-x:auto;margin:10px 0;font-size:12.5px;line-height:1.62;
  -webkit-overflow-scrolling:touch}
pre code{background:none;padding:0;color:#cbd5e1;white-space:pre}
pre::-webkit-scrollbar{height:5px}
pre::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;display:block;overflow-x:auto;
  -webkit-overflow-scrolling:touch}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--bg3);color:#fff;font-weight:600}
blockquote{margin:10px 0;padding:9px 12px;background:rgba(78,161,255,.09);
  border-left:3px solid var(--acc);border-radius:0 9px 9px 0}
blockquote.warn{background:rgba(210,153,34,.11);border-color:var(--warn)}
blockquote.bad{background:rgba(248,81,73,.11);border-color:var(--bad)}
blockquote.ok{background:rgba(63,185,80,.11);border-color:var(--ok)}
blockquote p{margin:4px 0}

/* ---------- 计划 ---------- */
.day{background:var(--bg2);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.day-h{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.day-h .no{width:42px;height:34px;flex:none;border-radius:10px;background:var(--bg3);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--acc);
  white-space:nowrap;letter-spacing:-.2px}
.day-h .t{flex:1;min-width:0}
.day-h .t b{display:block;font-size:14.5px}
.day-h .t span{font-size:11.5px;color:var(--fg3)}
.day-h .pct{font-size:11px;color:var(--fg2);font-variant-numeric:tabular-nums}
.day.done .day-h .no{background:rgba(63,185,80,.18);color:var(--ok)}
.day-b{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.day.open .day-b{display:block}
.day-b .goal{font-size:12.5px;color:var(--fg2);background:var(--bg3);
  border-radius:9px;padding:8px 10px;margin:11px 0}
.task{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task input{width:19px;height:19px;margin:3px 0 0;flex:none;accent-color:var(--ok)}
.task .tt{flex:1;min-width:0;font-size:13.5px}
.task .tt small{display:block;color:var(--fg3);font-size:11.5px;margin-top:2px}
.task.done .tt{color:var(--fg3);text-decoration:line-through}
.task.done .tt small{text-decoration:none}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--bg3);color:var(--fg2);
  border:1px solid var(--line)}
.tag.must{color:#ffb545;border-color:rgba(255,181,69,.35)}
.tag.skip{color:var(--fg3)}
.tag.pj{color:#7ee2b8;border-color:rgba(126,226,184,.3)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--acc2);color:#fff;
  border:0;border-radius:9px;padding:9px 14px;font-size:13.5px;font-family:var(--sans);cursor:pointer}
.btn.ghost{background:var(--bg3);color:var(--fg);border:1px solid var(--line)}
.btn.smk{padding:6px 10px;font-size:12.5px}

/* ---------- 课程 ---------- */
#topics{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
#topics::-webkit-scrollbar{display:none}
#topics button{flex:none;background:var(--bg3);border:1px solid var(--line);color:var(--fg2);
  border-radius:999px;padding:6px 11px;font-size:12px;font-family:var(--sans);cursor:pointer}
#topics button.on{background:var(--acc2);border-color:var(--acc);color:#fff}
.read{margin-bottom:8px}
.read-h{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--bg2);
  border:1px solid var(--line);border-radius:11px;cursor:pointer}
.read-h .no{font-family:var(--mono);font-size:12px;color:var(--acc);flex:none}
.read-h b{flex:1;font-size:14px}
.read-h .ck{font-size:12px;color:var(--fg3)}
.read-h.done .ck{color:var(--ok)}
.read-b{display:none;background:var(--bg2);border:1px solid var(--line);border-top:0;
  border-radius:0 0 11px 11px;padding:4px 14px 14px;margin-top:-4px}
.read.open .read-h{border-radius:11px 11px 0 0}
.read.open .read-b{display:block}
.meta{font-size:11.5px;color:var(--fg3);margin:9px 0 0;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 急救 / 速查 ---------- */
.fold{background:var(--bg2);border:1px solid var(--line);border-radius:11px;
  margin-bottom:9px;overflow:hidden}
.fold>summary{padding:11px 13px;cursor:pointer;font-size:14px;font-weight:600;
  list-style:none;display:flex;align-items:center;gap:8px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::marker{content:""}
.fold>summary::before{content:"▸";color:var(--acc);font-size:12px}
.fold[open]>summary::before{content:"▾"}
.fold>div{padding:0 13px 13px;font-size:14px}
.search{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:10px;
  color:var(--fg);font-family:var(--sans);font-size:14px;padding:10px 12px;margin-bottom:10px}
.search::placeholder{color:var(--fg3)}

/* ---------- 自测 ---------- */
.q{background:var(--bg2);border:1px solid var(--line);border-radius:13px;
  padding:13px;margin-bottom:12px}
.q .stem{font-size:14px;margin-bottom:10px}
.q .stem .no{color:var(--acc);font-family:var(--mono);font-size:12px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;background:var(--bg3);border:1px solid var(--line);
  color:var(--fg);border-radius:9px;padding:10px 12px;margin-bottom:7px;font-size:13.5px;
  font-family:var(--sans);cursor:pointer;line-height:1.55}
.opt.ok{background:rgba(63,185,80,.16);border-color:var(--ok)}
.opt.bad{background:rgba(248,81,73,.16);border-color:var(--bad)}
.exp{display:none;margin-top:9px;padding:10px 12px;background:rgba(78,161,255,.09);
  border-left:3px solid var(--acc);border-radius:0 9px 9px 0;font-size:13px}
.exp.on{display:block}
.score{font-size:13px;color:var(--fg2);margin:0 0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));
  background:rgba(40,48,63,.97);border:1px solid var(--line);color:#fff;font-size:13px;
  padding:9px 15px;border-radius:999px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:400px){
  main{padding:12px 11px 18px}
  table{font-size:12px}
  th,td{padding:5px 6px}
  pre{font-size:11.5px}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div style="flex:1;min-width:0">
      <h1>STM32 五天速通<span class="sub">[2-2] 新建工程 → [6-2] 定时器定时中断 &amp; 外部时钟</span></h1>
    </div>
    <span class="chip" id="overall">0%</span>
  </div>
  <div id="pbar"><div id="pfill"></div></div>
</header>

<main>
  <div class="view on" id="v-plan"></div>
  <div class="view" id="v-course"></div>
  <div class="view" id="v-c"></div>
  <div class="view" id="v-ref"></div>
  <div class="view" id="v-quiz"></div>
</main>

<nav>
  <button data-v="plan" class="on"><span class="ic">📅</span>计划</button>
  <button data-v="course"><span class="ic">📘</span>课程</button>
  <button data-v="c"><span class="ic">🩹</span>急救</button>
  <button data-v="ref"><span class="ic">🔍</span>速查</button>
  <button data-v="quiz"><span class="ic">✅</span>自测</button>
</nav>

<div class="toast" id="toast"></div>

<script>

  goal:'今天你会写出第一个**自己写的** STM32 程序。\n'
      +'必须先背下来的套路：**开时钟 → 配置 GPIO → 改变电平**，也就是 '
      +'`RCC_APB2PeriphClockCmd` → `GPIO_Init` → `GPIO_SetBits`/`GPIO_ResetBits`。'

    {id:'d2t4', t:'做 LED 闪烁：GPIO_SetBits / GPIO_ResetBits + 延时',

    {id:'d3t6', t:'光敏传感器控制蜂鸣器',
     s:'传感器模块的 DO 引脚接 GPIO 输入。资料：E:\\BaiduNetdiskDownload\\模块资料\\4-光敏电阻传感器',

    {id:'d3t7', t:'「课程」页复习 [3-3] 和 [3-4] 两节，重读《按键消抖》'},

{
  id:'d4', no:'Day 4', title:'[4-1] [4-2] OLED 调试　[5-1] EXTI 外部中断',

很多人都卡在 [[[2-2]]]，因为这一集要你手动**组织文件、配置编译器**，全是名词，看着很枯燥。

里面是已经写好的函数，比如 [[GPIO_SetBits()]]、[[TIM_Cmd()]]。

- [[Start]]：放启动文件 [[startup_stm32f10x_md.s]]、[[core_cm3.c/.h]]、[[stm32f10x.h]]、[[system_stm32f10x.c/.h]]
- [[Library]]：放 [[misc.c/.h]] 和所有 [[stm32f10x_xxx.c/.h]] 库文件
- [[User]]：放你自己的 [[main.c]]，以及从 Library 拷来的 [[stm32f10x_conf.h]]、[[stm32f10x_it.c/.h]]

**第六步：工程选项 → Debug → 选 ST-Link Debugger → Settings → Flash Download → 勾选 Reset and Run**

 {id:'c31a', no:'1', t:'GPIO 是什么，为什么要点灯',
  body:`
GPIO = **General Purpose Input Output**（通用输入输出口）。它是 STM32 和外界沟通最基础的通道。

- 引脚电平只有两种：**0V（低电平，逻辑 0）** 和 **3.3V（高电平，逻辑 1）**
- 部分引脚可以容忍 5V 输入（课件 P11 引脚定义里带 FT 标记的）
- 输出模式下可以控制引脚高低电平 → 驱动 LED、控制蜂鸣器、模拟通信协议时序
- 输入模式下可以读取引脚电平 → 读按键、读传感器模块输出、读通信数据

STM32F103C8T6 有 **GPIOA、GPIOB、GPIOC** 三组端口（LQFP48 封装下实际引出的引脚有限，
PA0–PA15、PB0–PB15、PC13–PC15 的部分）。每一组端口有 16 个引脚，PA0–PA15。

[ok] **为什么第一课一定是点灯？** 因为它是唯一一个「输出正确 + 硬件正确」就能立刻用眼睛看到结果的实验。
它验证了你整条链路：**Keil 工程 → 编译 → 烧录 → 芯片运行**。这条链路不通，后面学什么都是空谈。
`},
 {id:'c31b', no:'2', t:'8 种 GPIO 模式（PPT 上的核心表格）',
  body:`
| 模式 | 性质 | 特征 | 什么时候用 |
|---|---|---|---|
| 浮空输入 | 数字输入 | 可读引脚电平，悬空时电平不确定 | 外部已有上下拉电阻时 |
| 上拉输入 | 数字输入 | 内部接上拉电阻，悬空默认高电平 | **按键输入（按键接地）** |
| 下拉输入 | 数字输入 | 内部接下拉电阻，悬空默认低电平 | 按键输入（按键接电源） |
| 模拟输入 | 模拟输入 | GPIO 数字功能无效，引脚直连内部 ADC | **ADC 采集电压** |
| 开漏输出 | 数字输出 | 只能输出低电平，高电平为高阻态 | **I2C 的 SCL/SDA** |
| 推挽输出 | 数字输出 | 高电平接 VDD，低电平接 VSS，能主动输出两种电平 | **LED、蜂鸣器、普通输出** |
| 复用开漏输出 | 数字输出 | 由片上外设控制，特性同开漏 | 复用为 I2C 时 |
| 复用推挽输出 | 数字输出 | 由片上外设控制，特性同推挽 | 复用为 PWM、串口、SPI 时 |

**怎么记：** 先问「输入还是输出」→ 再问「模拟还是要数字」→ 输出再看「要不要主动输出高电平」。
- 推挽 = 两个管子一推一挽，能主动拉高也能拉低
- 开漏 = 只有下面那个管子，高电平得靠外部上拉电阻

[warn] **复用**这个词的意思是：这个引脚本来归 GPIO 管，现在「借给」片上的某个外设（定时器、串口）用，
所以叫复用功能。你在 [6-3] 学 PWM 输出时就要用**复用推挽输出**。
`},
 {id:'c31c', no:'3', t:'★ GPIO 推挽输出：配置五步法（必须背下来）',
  body:`
以「点亮 PA0 上的 LED」为例。**这五步是 STM32 所有外设配置的通用套路：**

**第一步：开时钟** —— 任何外设用之前都要开它的时钟，不开就完全没反应

\`\`\`
RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOA, ENABLE);   // GPIOA 挂在 APB2 总线上
\`\`\`

**第二步：定义并填充初始化结构体**

\`\`\`
GPIO_InitTypeDef GPIO_InitStructure;              // 定义一个结构体变量
GPIO_InitStructure.GPIO_Pin   = GPIO_Pin_0;       // 选择引脚 PA0
GPIO_InitStructure.GPIO_Mode  = GPIO_Mode_Out_PP; // 推挽输出 PP = Push-Pull
GPIO_InitStructure.GPIO_Speed = GPIO_Speed_50MHz; // 输出速度，点灯用 50MHz 都行
\`\`\`

**第三步：把结构体交给 GPIO_Init**

\`\`\`
GPIO_Init(GPIOA, &GPIO_InitStructure);            // 注意是 &，取地址
\`\`\`

**第四步：设置输出电平**

\`\`\`
GPIO_SetBits(GPIOA, GPIO_Pin_0);      // 输出高电平（3.3V）
GPIO_ResetBits(GPIOA, GPIO_Pin_0);    // 输出低电平（0V）
\`\`\`

**第五步（可选，更省事）：直接读写整个端口**

\`\`\`
GPIO_WriteBit(GPIOA, GPIO_Pin_0, Bit_SET);   // 单个引脚，不用区分函数名
GPIO_Write(GPIOA, 0x0001);                   // 一次写 16 个引脚
\`\`\`

[h3] 为什么 LED 通常是「低电平点亮」

因为核心板上的 LED 是这么接的：

\`\`\`
3.3V ──[限流电阻]──[LED]──→ PA1

\`\`\`
电流从 3.3V 流经 LED 到 PA1。只有当 PA1 输出**低电平（0V）**时，两端才有电压差，LED 才亮。
所以点灯的代码是 [[GPIO_ResetBits()]]，灭灯是 [[GPIO_SetBits()]]。

[warn] 这不是「反了」，是硬件决定的。看代码前先看你板子的原理图
（E 盘：[[1-STM32F103C8T6核心板\\STM32F103C8T6核心板原理图.pdf]]）。
`},
 {id:'c31d', no:'4', t:'LED 闪烁的完整程序（逐行注释版）',
  body:`
\`\`\`
#include "stm32f10x.h"        // 头文件，所有库函数和寄存器定义都在里面
#include "Delay.h"            // 自己写的延时函数

void LED_Init(void)           // 习惯：每个外设写一个 Init 函数
{
    GPIO_InitTypeDef GPIO_InitStructure;                       // 定义一个结构体变量

    RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOA, ENABLE);      // 1. 开 GPIOA 时钟

    GPIO_InitStructure.GPIO_Mode  = GPIO_Mode_Out_PP;          // 2. 推挽输出
    GPIO_InitStructure.GPIO_Pin   = GPIO_Pin_1;                //    用 PA1
    GPIO_InitStructure.GPIO_Speed = GPIO_Speed_50MHz;          //    50MHz 速度
    GPIO_Init(GPIOA, &GPIO_InitStructure);                     // 3. 初始化生效
}

int main(void)
{
    LED_Init();               // 先初始化 GPIO
    while (1)                 // 主循环，程序永远停在这里
    {
        GPIO_ResetBits(GPIOA, GPIO_Pin_1);   // LED 亮（低电平）
        Delay_ms(500);                       // 延时 500 毫秒
        GPIO_SetBits(GPIOA, GPIO_Pin_1);     // LED 灭（高电平）
        Delay_ms(500);
    }
}
\`\`\`

[h3] 三个新手必问

**Q：为什么 while(1) 死循环？**
因为单片机没有操作系统。[[main()]] 一旦返回，程序就跑到未定义的地方去了。
所有 STM32 程序的 [[main()]] 最后一定是 [[while(1)]]。

**Q：延时为什么不用 [[for]] 循环？**
[3-2] 视频里用了一个 [[Delay_ms()]] 函数（用 [[SysTick]] 或者空循环实现）。
用 for 循环写的延时不精确，而且编译器优化等级一改，延时时间就变了。

**Q：为什么 [[GPIO_Pin]] 可以用 [[|]] 组合？**
因为 [[GPIO_Pin_0]] 到 [[GPIO_Pin_15]] 定义的是 [[0x0001]]、[[0x0002]]、[[0x0004]]……
每个引脚占一个二进制位，所以 [[GPIO_Pin_0 | GPIO_Pin_1]] 就是同时选两个引脚。
这就是「急救」页里讲的**位运算**的实际用途。
`}
]

 {id:'c32a', no:'1', t:'LED 流水灯（用数组 + 循环，别写 8 遍）',
  body:`
最笨的写法是把点灯代码复制 8 遍，改一下引脚号。正确的写法：

\`\`\`
int main(void)
{
    LED_Init();
    uint16_t pins[8] = {GPIO_Pin_0, GPIO_Pin_1, GPIO_Pin_2, GPIO_Pin_3,
                        GPIO_Pin_4, GPIO_Pin_5, GPIO_Pin_6, GPIO_Pin_7};
    uint8_t i;

    while (1)
    {
        for (i = 0; i < 8; i++)                    // 遍历数组
        {
            GPIO_ResetBits(GPIOA, pins[i]);        // 点亮第 i 个
            Delay_ms(200);
            GPIO_SetBits(GPIOA, pins[i]);          // 熄灭第 i 个
        }
    }
}
\`\`\`

这里用到的 C 语言知识（「急救」页第 4 节）：
- [[uint16_t pins[8]]] 是**数组**：一次存放 8 个值
- [[pins[i]]] 是**下标访问**：i 从 0 数到 7
- [[for (i = 0; i < 8; i++)]] 是**循环**：i 从 0 开始，每次加 1，到 8 就停

[ok] 你能把这个数组写法讲清楚，说明你已经跨过「只会抄代码」的阶段了。

 {id:'c32c', no:'3', t:'今天必须搞懂的一个问题：为什么要开时钟',
  body:`
这是新手最容易忽略、但面试官最爱问的问题。

STM32 的外设（GPIO、定时器、串口……）都**挂在总线**上（APB1、APB2、AHB）。
每个外设都有一个「时钟使能位」，默认是**关闭**的。

[bad] 你调用 [[GPIO_Init()]] 的时候，其实只是往寄存器里写了配置值。
如果时钟没开，写进去也没用——外设根本没有时钟驱动，寄存器不工作，引脚一点反应都没有。
现象就是：**代码看起来完全正确，但灯就是不亮，而且不报任何错。**

所以就成了一条铁律：

\`\`\`
用任何外设之前，先开它的时钟。
GPIOA / GPIOB / GPIOC → RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOx, ENABLE)
\`\`\`

查总线归属的方法：课件 P8 的「片上资源」表，或者任何时候直接查参考手册。
初学者记住这个就够了：**F103 上 GPIO、EXTI、ADC1、USART1、SPI1、TIM1 在 APB2；
USART2/3、I2C、TIM2/3/4 在 APB1。**
`}
]

 {id:'c33a', no:'1', t:'GPIO 输入模式怎么选',
  body:`
输入模式下 GPIO **不再控制引脚**，而是去**读取**引脚当前的电平。

| 模式 | 内部电阻 | 悬空时读到什么 | 典型用途 |
|---|---|---|---|
| 浮空输入 | 无 | **不确定**（随电压漂移，可能是0也可能是1） | 外部电路已有上下拉电阻时 |
| 上拉输入 | 接 3.3V | 高电平（1） | **按键（按键另一端接 GND）** |
| 下拉输入 | 接 GND | 低电平（0） | 按键（按键另一端接 3.3V） |
| 模拟输入 | 无，直连 ADC | — | ADC 采集电压 |

**按键为什么用上拉输入：** 按键一端接引脚、另一端接 GND。松手时引脚什么都不接（悬空），
如果没有内部上拉电阻，读到的电平是**随机的**；有了上拉电阻，松手读到 1，按下被拉到 GND 读到 0。

[warn] 反过来，如果按键另一端接的是 3.3V，就选**下拉输入**。选错模式的现象是：
**按键怎么按都读不到变化，或者一直是按下的状态。**
`},
 {id:'c33b', no:'2', t:'读引脚电平：GPIO_ReadInputDataBit',
  body:`
\`\`\`
void Key_Init(void)
{
    GPIO_InitTypeDef GPIO_InitStructure;
    RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOB, ENABLE);

    GPIO_InitStructure.GPIO_Pin  = GPIO_Pin_1;
    GPIO_InitStructure.GPIO_Mode = GPIO_Mode_IPU;   // IPU = Input Pull-Up 上拉输入
    GPIO_Init(GPIOB, &GPIO_InitStructure);
}

// 读取单个引脚：
uint8_t KeyNum = GPIO_ReadInputDataBit(GPIOB, GPIO_Pin_1);   // 返回 0 或 1

// 读取整个端口（16 位）：
uint16_t portVal = GPIO_ReadInputData(GPIOB);
\`\`\`

对比一下输出，命名很有规律：

| 读输入 | 写输出 |
|---|---|
| [[GPIO_ReadInputDataBit(GPIOx, pin)]] | [[GPIO_WriteBit(GPIOx, pin, val)]] |
| [[GPIO_ReadInputData(GPIOx)]] | [[GPIO_Write(GPIOx, val)]] |
| [[GPIO_ReadOutputDataBit()]] （读输出寄存器的值） | [[GPIO_SetBits]] / [[GPIO_ResetBits]] |

[warn] [[GPIO_ReadOutputData()]] 读的是**输出数据寄存器**，不是引脚实际电平。
想读引脚真实电平，只能用 [[GPIO_ReadInputDataBit()]]。
`},
 {id:'c33c', no:'3', t:'★ 按键抖动与消抖（高频考点）',
  body:`
**抖动是什么：** 按键内部是机械弹簧片，按下和松手的瞬间，金属片不会干净地一次接触，
而是在几十微秒内**反复通断好几次**。这个现象叫**按键抖动（bounce）**。

**后果：** 你写「按一次，LED 翻转一次」，结果按一下 LED 翻转了 3 次。
在屏幕上表现为数字跳了好几个，在中断方式下表现为中断触发了多次。

**抖动的时间：** 一般是 **5~20ms**（机械按键典型值，视频里讲 5~10ms）。

[h3] 软件消抖（最常用）

思路：检测到电平变化后，**延时 20ms 再读一次**，两次都是按下状态才认为是真的按下。

\`\`\`
uint8_t Key_GetNum(void)
{
    uint8_t KeyNum = 0;

    if (GPIO_ReadInputDataBit(GPIOB, GPIO_Pin_1) == 0)   // 第一次检测到按下
    {
        Delay_ms(20);                                    // 延时 20ms 跳过抖动期
        while (GPIO_ReadInputDataBit(GPIOB, GPIO_Pin_1) == 0);  // 等待松手，避免连发（这行才是关键）
        Delay_ms(20);                                    // 松手也消抖
        KeyNum = 1;
    }
    return KeyNum;
}
\`\`\`

[warn] [[while (GPIO_ReadInputDataBit(...) == 0);]] 这一行容易被漏掉。
漏掉它，按住按键不放时，主循环每转一圈都会返回一次「按下」，数字疯狂递增。
加上它，程序会**卡在 while 里等松手**，一次按下只算一次。

[h3] 硬件消抖

在按键两端并联一个 **0.1µF 电容**，利用电容充放电把抖动滤掉。成本高一点，但软件更简单。

[ok] **自己动手做这个对比实验：** 先写一版不消抖的代码，用 OLED 或串口打印计数，
按一下看数字涨了几个；再加上消抖，看是不是每次只涨 1。这个实验做一遍，
比背十遍「按键抖动定义」有用得多。
`},
]
},

|---|---|---|---|

转它就能改变「多暗算暗」的分界点。调不出效果时，先怀疑这个旋钮的位置。

{
p:'5-1', short:'EXTI外部中断',
link:'https://www.bilibili.com/video/BV1th411z7sn?p=11',
items:[
 {id:'c51a', no:'1', t:'★ 中断系统（[5-1] 前置知识，全课程最重要的地基）',
  body:`
[h3] 什么是中断

**中断（Interrupt）**：在主程序运行过程中，出现了特定的**中断触发条件（中断源）**，
使得 CPU **暂停当前正在运行的程序**，转而去处理**中断程序**，
处理完成后又**返回原来被暂停的位置继续运行**。

打个比方：你在写作业（主程序），电话响了（中断源），你放下笔去接电话（中断程序），
接完回来接着写（返回断点）。电话就是中断源，你放笔的位置就是断点。

[h3] 中断执行流程

\`\`\`
主程序 ──┬──────────────┬──────────→
         │ 中断请求      │ 继续执行
         ↓              ↑
      中断程序 ─────────┘（返回断点）
\`\`\`

[h3] STM32 的中断资源

STM32F103C8T6 有 **68 个可屏蔽中断通道**，包含 EXTI、TIM、ADC、USART、SPI、I2C 等外设的中断。
中断太多，CPU 忙不过来，所以有了下面的调度器。

[h3] NVIC：嵌套向量中断控制器

NVIC 是内核里的一个外设，负责**管理所有中断的优先级和调度**。它的核心是**优先级**：

\`\`\`
CPU ──── NVIC ──┬── EXTI（优先级 0）
                ├── TIM （优先级 1）
                ├── ADC （优先级 2）
                └── USART（优先级 3）
\`\`\`

**优先级数字越小的优先级越高**（注意！不是越大越高）。

[h3] ★ NVIC 优先级分组（最容易搞混的一节）

NVIC 的优先级由优先级寄存器的 **4 位（取值 0~15）** 决定。这 4 位可以被切分成两部分：

\`\`\`
            4 位优先级寄存器
  ┌──────────────┬──────────────┐
  │ 高 n 位       │ 低 (4-n) 位    │
  │ 抢占优先级     │ 响应优先级      │
  └──────────────┴──────────────┘
\`\`\`

| 分组 | 抢占优先级位数 | 响应优先级位数 | 抢占优先级取值范围 | 响应优先级取值范围 |
|---|---|---|---|---|
| NVIC_PriorityGroup_0 | 0 位 | 4 位 | 无 | 0~15 |
| NVIC_PriorityGroup_1 | 1 位 | 3 位 | 0~1 | 0~7 |
| **NVIC_PriorityGroup_2** | **2 位** | **2 位** | **0~3** | **0~3** |
| NVIC_PriorityGroup_3 | 3 位 | 1 位 | 0~7 | 0~1 |
| NVIC_PriorityGroup_4 | 4 位 | 0 位 | 0~15 | 无 |

[ok] **初学者直接用 NVIC_PriorityGroup_2**（每组各 2 位，各 4 个等级），够用了。

[h3] 抢占优先级 vs 响应优先级（区别必须记住）

| | 抢占优先级（Preemption） | 响应优先级（Sub） |
|---|---|---|
| 作用 | 决定**能不能打断**正在执行的中断 | 决定**同时到来时谁先执行** |
| 高的一方 | 可以打断低的一方，形成**中断嵌套** | **不能**打断正在执行的中断，只能等它执行完 |
| 同时触发 | 抢占优先级高的先执行 | 抢占相同时，响应优先级高的先执行 |
| 都相同时 | —— | 按**中断号**（IRQ 编号）小的先执行 |

[warn] 记忆口诀：**抢占优先级决定「插不插队」，响应优先级决定「排队顺序」。**

[h3] 一个例子

中断 A：抢占 2，响应 0；中断 B：抢占 1，响应 3。当前 A 正在执行，B 来了。
→ B 的抢占优先级（1）比 A（2）高，**B 可以打断 A**，形成中断嵌套，B 执行完再回到 A。

如果 A：抢占 1、响应 0；B：抢占 1、响应 1。A 正在执行，B 来了。
→ 抢占优先级相同，**B 不能打断 A**，只能排队等 A 执行完。

[h3] 中断服务函数（ISR）怎么写

中断发生时，CPU 会自动跳到对应名字的函数去执行。**函数名是固定的，不能自己起名**：

\`\`\`
void EXTI0_IRQHandler(void)          // 函数名固定！对应 EXTI 线路 0
{
    if (EXTI_GetITStatus(EXTI_Line0) == SET)   // 判断是不是这条线路触发的中断
    {
        // 在这里写你要干的事，比如翻转 LED

        EXTI_ClearITPendingBit(EXTI_Line0);    // ★ 必须清除中断标志位！
    }
}
\`\`\`

[bad] **忘了 [[EXTI_ClearITPendingBit()]] 会怎样？**
中断标志位不清除，CPU 认为中断还在，会**无限重复进入这个中断函数**，程序就卡死在这里了，
主程序再也不运行。这是新手最常见的「程序卡死」原因之一。
`},
 {id:'c51b', no:'2', t:'EXTI 外部中断：基本结构',
  body:`
**EXTI（Extern Interrupt）外部中断**：监测指定 GPIO 口的电平信号，产生电平变化时，
立即向 NVIC 发出中断申请，经过 NVIC 裁决后中断 CPU 主程序。

| 特性 | 内容 |
|---|---|
| 支持的触发方式 | **上升沿** / **下降沿** / **双边沿** / **软件触发** |
| 支持的 GPIO | 所有 GPIO 口，但**相同的 Pin 不能同时触发中断** |
| 通道数 | 16 个 GPIO_Pin + PVD 输出、RTC 闹钟、USB 唤醒、以太网唤醒 |
| 触发响应方式 | 中断响应 / 事件响应 |

[warn] **「相同的 Pin 不能同时触发中断」**是什么意思？
EXTI 按**引脚号**分组：PA0、PB0、PC0 共用 **EXTI0**。所以你不能同时用 PA0 和 PB0 做外部中断。
配置 PB0 会覆盖 PA0 的 EXTI 配置。这是个很隐蔽的坑。

[h3] 触发方式怎么选

- **上升沿**：电平从低变高时触发。例如按键**松手**瞬间（上拉输入的按键）
- **下降沿**：电平从高变低时触发。例如按键**按下**瞬间、红外传感器被遮挡
- **双边沿**：两种都触发。例如旋转编码器的 A/B 相计次

注意：课件 P48 的 **AFIO** 是「复用 IO 口」，EXTI 的引脚选择要经过 AFIO，
所以配置 EXTI 时也必须开 **AFIO 的时钟**（[[RCC_APB2Periph_AFIO]]）。

[h3] 配置 EXTI 的完整步骤

\`\`\`
void CountSensor_Init(void)
{
    GPIO_InitTypeDef GPIO_InitStructure;
    EXTI_InitTypeDef EXTI_InitStructure;         // ★ 多了一个结构体
    NVIC_InitTypeDef NVIC_InitStructure;         // ★ 还要配 NVIC

    // 1. 开时钟：GPIOB + AFIO
    RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOB | RCC_APB2Periph_AFIO, ENABLE);

    // 2. 配置 GPIO 为输入（这里用上拉输入）
    GPIO_InitStructure.GPIO_Pin  = GPIO_Pin_14;
    GPIO_InitStructure.GPIO_Mode = GPIO_Mode_IPU;
    GPIO_Init(GPIOB, &GPIO_InitStructure);

    // 3. 把 GPIO 引脚映射到 EXTI 线路（走 AFIO）
    GPIO_EXTILineConfig(GPIO_PortSourceGPIOB, GPIO_PinSource14);

    // 4. 配置 EXTI
    EXTI_InitStructure.EXTI_Line    = EXTI_Line14;
    EXTI_InitStructure.EXTI_Mode    = EXTI_Mode_Interrupt;   // 中断模式（不是事件）
    EXTI_InitStructure.EXTI_Trigger = EXTI_Trigger_Falling;  // 下降沿触发
    EXTI_InitStructure.EXTI_LineCmd = ENABLE;
    EXTI_Init(&EXTI_InitStructure);

    // 5. 配置 NVIC（中断优先级）
    NVIC_PriorityGroupConfig(NVIC_PriorityGroup_2);          // 整个工程设置一次即可
    NVIC_InitStructure.NVIC_IRQChannel = EXTI15_10_IRQn;     // 注意是 15_10，不是 14！
    NVIC_InitStructure.NVIC_IRQChannelPreemptionPriority = 1;// 抢占优先级
    NVIC_InitStructure.NVIC_IRQChannelSubPriority        = 1;// 响应优先级
    NVIC_InitStructure.NVIC_IRQChannelCmd = ENABLE;
    NVIC_Init(&NVIC_InitStructure);
}
\`\`\`

[bad] **最容易错的地方：中断通道号和中断函数名。**
EXTI 线路 10~15 共用同一个中断通道：[[EXTI15_10_IRQn]]，函数名是 [[EXTI15_10_IRQHandler()]]。

同样，线路 5~9 共用 [[EXTI9_5_IRQn]]；线路 0~4 是各自独立的 [[EXTI0_IRQn]] ~ [[EXTI4_IRQn]]。

[h3] 中断函数里判断具体是哪条线路

因为 15 和 10 共用一个通道，函数里要判断：

\`\`\`
void EXTI15_10_IRQHandler(void)
{
    if (EXTI_GetITStatus(EXTI_Line14) == SET)     // 确认是 Line14
    {
        CountSensor_Count ++;                     // 计次
        EXTI_ClearITPendingBit(EXTI_Line14);      // ★ 清除标志
    }
}
\`\`\`

 {id:'c61a', no:'1', t:'定时器是什么，STM32F103 有几个',
  body:`
**TIM（Timer）定时器**：对输入的时钟进行计数，并在计数值达到设定值时**触发中断**。

\`\`\`
时钟源 ──→ [预分频器 PSC] ──→ [计数器 CNT] ──→ 计到 ARR 值 ──→ 产生中断
                                  ↑                    │
                             计一个数加一          自动重装
\`\`\`

**STM32F103C8T6 的定时器资源：TIM1、TIM2、TIM3、TIM4**

| 类型 | 编号 | 总线 | 功能 |
|---|---|---|---|
| **高级定时器** | TIM1 | APB2 | 通用功能 + 死区生成、互补输出、重复计数器、刹车输入 |
| **通用定时器** | TIM2、TIM3、TIM4 | **APB1** | 基本定时 + 输入捕获、输出比较、编码器接口、主从触发 |
| **基本定时器** | TIM6、TIM7（F103C8T6 没有） | APB1 | 只有最基本的定时中断 |

[warn] **开时钟时注意：** TIM1 在 APB2，[[RCC_APB2PeriphClockCmd(RCC_APB2Periph_TIM1, ENABLE)]]；
TIM2/3/4 在 APB1，[[RCC_APB1PeriphClockCmd(RCC_APB1Periph_TIM2, ENABLE)]]。
写错总线，现象就是「定时器完全不工作」。
`},
 {id:'c61b', no:'2', t:'★ 时基单元：PSC / CNT / ARR 三者关系（本节核心）',
  body:`
**时基单元**是定时器的心脏，由三个寄存器组成：

| 寄存器 | 名称 | 作用 |
|---|---|---|
| **PSC** | 预分频器（Prescaler） | 把输入时钟**降频**，16 位，取值 0~65535 |
| **CNT** | 计数器（Counter） | 每个时钟周期加 1，16 位，取值 0~65535 |
| **ARR** | 自动重装寄存器（Auto-Reload Register） | CNT 数到这个值就**溢出**，产生中断，并把 CNT 归零重新开始 |

[h3] 频率计算公式（背下来）

\`\`\`
计数频率      CK_CNT    = CK_PSC / (PSC + 1)
溢出频率(中断频率) CK_CNT_OV = CK_CNT / (ARR + 1)
                          = CK_PSC / (PSC + 1) / (ARR + 1)
\`\`\`

其中 [[CK_PSC]] 是定时器的输入时钟。以 TIM2 为例（挂 APB1，但因为有倍频，实际是 72MHz）：
[[CK_PSC = 72MHz]]。

[h3] ★ 经典题目：要 1 秒一次中断，PSC 和 ARR 填多少？

\`\`\`
72MHz / (PSC+1) / (ARR+1) = 1Hz
→ (PSC+1) × (ARR+1) = 72,000,000
\`\`\`

配对方案（选一个即可）：

| PSC | PSC+1 | ARR | ARR+1 | 乘积 | 结果 |
|---|---|---|---|---|---|
| **7199** | 7200 | **9999** | 10000 | 72,000,000 | **1Hz（1 秒）** ✔ |
| 7199 | 7200 | 19999 | 20000 | 144,000,000 | 0.5Hz（2 秒） |
| 0 | 1 | 65535 | 65536 | 65,536 | ≈1.1kHz |

[ok] 视频和课件里常用的就是 **PSC = 7200-1、ARR = 10000-1**，正好 1 秒。
注意代码里填的是 **减 1 后的值**（因为硬件会自动 +1）。

[h3] 为什么分母要「+1」

因为硬件设计上：写 0 表示 1 分频（不分频），写 1 表示 2 分频。
所以实际分频系数 = 寄存器值 + 1。这个细节写错，定时时间就差一倍。

[h3] 最大定时时间

课件 P52 提到：16 位 PSC 和 ARR 都最多 65535，
所以最大分频 = 65536 × 65536，在 72MHz 下最大定时约 **59.65 秒**。
超过这个时间就得用「中断里再累加计数」的办法。
`},
 {id:'c61c', no:'3', t:'定时中断的配置步骤（六步）',
  body:`
\`\`\`
void Timer_Init(void)
{
    TIM_TimeBaseInitTypeDef TIM_TimeBaseInitStructure;
    NVIC_InitTypeDef NVIC_InitStructure;

    // 1. 开 TIM2 的时钟（注意 APB1）
    RCC_APB1PeriphClockCmd(RCC_APB1Periph_TIM2, ENABLE);

    // 2. 选择时基单元的时钟源（默认就是内部时钟，这行可以省略，但写上更清楚）
    TIM_InternalClockConfig(TIM2);

    // 3. 配置时基单元
    TIM_TimeBaseInitStructure.TIM_ClockDivision     = TIM_CKD_DIV1;   // 时钟分频（和时基无关，一般 DIV1）
    TIM_TimeBaseInitStructure.TIM_CounterMode       = TIM_CounterMode_Up;  // 向上计数
    TIM_TimeBaseInitStructure.TIM_Period            = 10000 - 1;      // ★ ARR，注意 -1
    TIM_TimeBaseInitStructure.TIM_Prescaler         = 7200  - 1;      // ★ PSC，注意 -1
    TIM_TimeBaseInitStructure.TIM_RepetitionCounter = 0;              // 高级定时器才用，通用定时器填 0
    TIM_TimeBaseInit(TIM2, &TIM_TimeBaseInitStructure);

    // 4. 清除初始化后立刻产生的更新中断标志（否则会一开机就进一次中断）
    TIM_ClearFlag(TIM2, TIM_FLAG_Update);

    // 5. 使能更新中断
    TIM_ITConfig(TIM2, TIM_IT_Update, ENABLE);

    // 6. 配置 NVIC
    NVIC_PriorityGroupConfig(NVIC_PriorityGroup_2);
    NVIC_InitStructure.NVIC_IRQChannel = TIM2_IRQn;
    NVIC_InitStructure.NVIC_IRQChannelPreemptionPriority = 2;
    NVIC_InitStructure.NVIC_IRQChannelSubPriority        = 1;
    NVIC_InitStructure.NVIC_IRQChannelCmd = ENABLE;
    NVIC_Init(&NVIC_InitStructure);

    // 7. 启动定时器（很多人忘了这步）
    TIM_Cmd(TIM2, ENABLE);
}

// 中断函数名固定
void TIM2_IRQHandler(void)
{
    if (TIM_GetITStatus(TIM2, TIM_IT_Update) == SET)
    {
        // 每 1 秒执行一次，比如让计数变量 +1

        TIM_ClearITPendingBit(TIM2, TIM_IT_Update);   // ★ 必须清标志
    }
}
\`\`\`

[warn] **三个高频错误：**
1. 忘了 [[TIM_Cmd(TIM2, ENABLE)]] → 定时器根本不启动，中断永远不来
2. 忘了 [[TIM_ClearITPendingBit()]] → 卡在中断里出不来
3. TIM2 挂在 APB1 却写了 [[RCC_APB2PeriphClockCmd]] → 不工作
`},

 {id:'c62a', no:'1', t:'定时器外部时钟（ETR）',
  body:`
前面用的是**内部时钟**（RCC 提供的 72MHz）。定时器还可以用**外部时钟源**，
这就是 [6-2] 的第二个例程。

**外部时钟的几个来源（见课件 P57 的框图）：**

| 来源 | 说明 |
|---|---|
| **ETR**（External Trigger） | 从外部引脚输入脉冲，**每个脉冲计一个数** |
| ITRx | 来自其他定时器的输出（定时器级联） |
| TIx | 来自捕获通道的输入 |
| 内部时钟 | RCC 提供的默认时钟 |

[h3] 配置外部时钟的关键一句

\`\`\`
TIM_ETRClockMode2Config(TIM2,
                        TIM_ExtTRGPSC_OFF,      // 外部触发预分频：不分频
                        TIM_ExtTRGPolarity_NonInverted,  // 不反相
                        0x0F);                  // 滤波器
\`\`\`

这一句替换掉 [[TIM_InternalClockConfig(TIM2)]]。之后 ETR 引脚上每来一个脉冲，
CNT 就加 1，累计到 ARR 值就触发中断。

[h3] 典型用途

用对射式红外传感器接在 ETR 引脚上，**每挡一次光计一个数**——
这是硬件计数器，比用 EXTI 中断计数**精确得多**，而且**完全不占 CPU**。
因为中断方式是「每次边沿都要进一次中断函数」，而外部时钟是「硬件自己数，数够了再通知你」。

[ok] 这是理解「硬件外设替 CPU 干活」这个概念的第一个例子。
后面 [7-2] 的 ADC + DMA、[6-8] 的编码器接口，都是同一个思路。
`}

{open:true, t:'0. 没有 C 语言基础，今天你只需要看懂这些',
 body:`
先给你吃个定心丸：**STM32 入门阶段用到的 C 语言，只占 C 语言总量的 10% 左右**，
而且反复就那么几个套路。你不需要系统学完 C 语言再开始。

[h3] 一段真实的 STM32 代码，逐行翻译

\`\`\`
void LED_Init(void)                  // 定义一个函数，叫 LED_Init，没有返回值，没有参数
{                                    // 函数体从 { 开始
    GPIO_InitTypeDef GPIO_InitStructure;   // 声明一个变量，类型是 GPIO_InitTypeDef

    RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOA, ENABLE);  // 调用别人写好的一函数，传两个参数

    GPIO_InitStructure.GPIO_Mode  = GPIO_Mode_Out_PP;      // 给变量的成员赋值
    GPIO_InitStructure.GPIO_Pin   = GPIO_Pin_1;
    GPIO_Init(GPIOA, &GPIO_InitStructure);                 // 调用函数，第二个参数是"地址"
}                                    // 函数体到 } 结束

int main(void)                       // 主函数，程序从这里开始跑
{
    LED_Init();                      // 调用上面那个函数
    while (1)                        // 死循环，条件 1 永远为真
    {
        GPIO_ResetBits(GPIOA, GPIO_Pin_1);
        Delay_ms(500);
        GPIO_SetBits(GPIOA, GPIO_Pin_1);
        Delay_ms(500);
    }
}
\`\`\`

看到没有——**整段代码里你真正要"理解"的，只有下面 6 个概念**。

[h3] 概念 1：函数 —— 一段可重复使用的代码

[[函数]]的基本形状：[[return类型 函数名(参数列表) { 代码 }]]

- 用**别人写好的**函数：[[GPIO_SetBits(GPIOA, GPIO_Pin_1);]] 直接调，括号里的东西叫参数
- 写**自己的**函数：[[void LED_Init(void)]] ，[[void]] 意思是"没有返回值"，[[(void)]] 意思是"没有参数"
- 函数名自己起，但**别人写好的函数名一个字母都不能改**

[h3] 概念 2：变量与类型 —— 数据的容器

[[uint16_t count = 0;   // 声明一个 16 位无符号整数，初值 0]]

- [[uint16_t]] 是类型，[[count]] 是变量名，[[= 0]] 是初始值
- 变量必须先**声明**（告诉编译器它是谁）再**使用**
- 声明在函数里面 = 局部变量（只有这个函数能用）
- 声明在所有函数外面 = 全局变量（所有函数都能用，**中断函数里改的变量必须是全局的**）

[h3] 概念 3：语句与分号

**每一条语句结尾必须有分号 [[;]]**。少一个分号是新手最高频的报错，
报错信息还常常指向下一行，让你找不到真正的位置。

[h3] 概念 4：{} 花括号 —— 把多条语句打包

\`\`\`
if (条件) {
    语句1;      // 这些语句属于 if
    语句2;
}
\`\`\`

\`\`\`
while (1) {
    语句1;      // 这些语句会被无限重复
}
\`\`\`

[h3] 概念 5：注释 —— 给人看的，编译器忽略

\`\`\`
// 这是单行注释，只在这一行有效
/* 这是
   多行注释 */
\`\`\`

[ok] **强烈建议：** 从今天开始，每写一段代码就写一行注释说明它在干什么。
三个月后你会感谢现在的自己。

[h3] 概念 6：库函数调用 = 拼积木

STM32 的编程方式，本质是「**把官方写好的函数按顺序排列起来**」。
所以入门阶段最重要的能力不是"写代码"，而是"**查手册、抄对函数名、填对参数**"。

下面 8 节把你会遇到的语法一次讲完。**今天只需要读到第 6 节，剩下的用到再回来看。**
`
},
{open:true, t:'1. 数据类型与 u8 / u16 / u32',
 body:`
课件 P32 的表，翻译成人话：

| 关键字 | 位数 | 表示范围 | stdint 写法 | ST 写法 | 什么时候用 |
|---|---|---|---|---|---|
| [[char]] | 8 | -128 ~ 127 | [[int8_t]] | [[s8]] | 很少用 |
| [[unsigned char]] | 8 | 0 ~ 255 | [[uint8_t]] | [[u8]] | **0~255 的小数字** |
| [[short]] | 16 | -32768 ~ 32767 | [[int16_t]] | [[s16]] | 有符号 16 位 |
| [[unsigned short]] | 16 | 0 ~ 65535 | [[uint16_t]] | [[u16]] | **GPIO 引脚掩码、计数** |
| [[int]] | 32 | -2147483648 ~ 2147483647 | [[int32_t]] | [[s32]] | 普通整数 |
| [[unsigned int]] | 32 | 0 ~ 4294967295 | [[uint32_t]] | [[u32]] | **寄存器值、大计数** |

**ST 官方库里的两套写法是等价的：**

\`\`\`
u8  a = 255;      // 就是 unsigned char，0~255
u16 b = 65535;    // 就是 unsigned short
u32 c = 0xFFFFFFFF;
uint8_t  d = 255; // 和 u8 完全一样
\`\`\`

[h3] 为什么需要"位数"这个概念

因为单片机里的数不是无穷大的。**8 位的变量装不下 256**：

\`\`\`
u8 i = 255;
i = i + 1;        // 结果不是 256，而是 0 ！这叫"溢出"
\`\`\`

这类 bug 极其隐蔽。常见场景：[[u8]] 类型的中断计数值，数到 255 就归零了，
你还在纳闷"为什么数到 255 就不涨了"。**计数变量建议直接用 [[u16]] 或 [[u32]]。**

[h3] 有符号与无符号

- [[unsigned]]（无符号）：只能表示 0 和正数，范围是 0 ~ 2^n - 1
- 不带 [[unsigned]]（有符号）：用最高位表示正负，所以正数范围减半，但能表示负数

**初学建议：数字类的变量一律先用 [[unsigned]] 开头**，除非你确定需要负数。

[h3] 十六进制的读法

STM32 里到处是 [[0x]] 开头的数字，这是十六进制：

- [[0x01]] = 1，[[0x0A]] = 10，[[0x10]] = 16，[[0x100]] = 256，[[0xFF]] = 255
- 规则：[[0x]] 后面每多一位，就是乘 16

为什么要用十六进制？因为它和二进制是 1 位对 4 位的整齐关系：
[[0xF]] = [[1111]]，[[0xFF]] = [[11111111]]。用十六进制写"哪些位是 1"特别直观，
这正是下面「位运算」一节要用的。
`},
{open:true, t:'2. 宏定义 #define —— 给数字起名字',
 body:`
**用途：用一个字符串代替一个数字**，便于理解、防止出错；也可以把经常出现的参数提取出来，方便统一修改。

\`\`\`
#define ABC 12345          // 定义：把 ABC 定义为 12345

int a = ABC;               // 引用：等效于 int a = 12345;
\`\`\`

**注意：[[#define]] 结尾没有分号！**（写了分号，分号也会被替换进去，这是经典坑）

[h3] 在 STM32 里你会看到它无处不在

\`\`\`
#define GPIO_Pin_0    ((uint16_t)0x0001)   // 官方库里的定义
#define RCC_APB2Periph_GPIOA  ((uint32_t)0x00000004)
\`\`\`

所以你写 [[GPIO_Pin_0]] 的时候，编译器看到的其实是 [[0x0001]]。
**这就解释了为什么 [[GPIO_Pin_0 | GPIO_Pin_1]] 能同时选中两个引脚**——
它们分别是 [[0x0001]] 和 [[0x0002]]，按位或起来就是 [[0x0003]]，第 0 位和第 1 位都是 1。

[h3] 自己定义宏的三个典型场景

\`\`\`
#define LED_GPIO_PORT   GPIOA       // 万一改板子，只改这一行
#define LED_GPIO_PIN    GPIO_Pin_1
#define DELAY_TIME      500         // 想调节奏，只改这一行

GPIO_ResetBits(LED_GPIO_PORT, LED_GPIO_PIN);
\`\`\`

[ok] **这是"好代码"和"能跑的代码"的区别。** 视频里教的例程常常直接把 [[GPIOA]] 写死，
你自己写的时候改成宏，之后换板子会轻松很多。
`},
{open:true, t:'3. typedef —— 给类型起别名',
 body:`
**用途：把一个比较长的变量类型名换个短名字**，便于使用。

\`\`\`
typedef unsigned char uint8_t;    // 定义：给 unsigned char 起别名 uint8_t

uint8_t a;                        // 引用：等效于 unsigned char a;
\`\`\`

[h3] 在 STM32 里的实际用途：让结构体用起来更舒服

\`\`\`
typedef struct {
    uint16_t GPIO_Pin;
    GPIOSpeed_TypeDef GPIO_Speed;
    GPIOMode_TypeDef  GPIO_Mode;
} GPIO_InitTypeDef;
\`\`\`

有了 [[typedef]]，你就可以直接写 [[GPIO_InitTypeDef GPIO_InitStructure;]]，
而不用写 [[struct { ... } GPIO_InitStructure;]]。

[ok] 一句话记法：**[[typedef]] = 起外号。[[struct]] = 打包。** 官方库几乎全是这两者组合。
`},
{open:true, t:'4. ★ 结构体 struct —— 数据打包（今天必须懂）',
 body:`
**用途：把不同类型的数据打包成一个整体。**

\`\`\`
struct {
    char  x;
    int   y;
    float z;
} StructName;              // StructName 是变量名

StructName.x = 'A';        // 用 . 访问成员
StructName.y = 66;
StructName.z = 1.23;
\`\`\`

[h3] ★ 这在 STM32 里为什么如此重要

因为 STM32 的库函数采用了「**先填表，再交货**」的编程风格：

\`\`\`
GPIO_InitTypeDef GPIO_InitStructure;                // 1. 拿来一张空表

GPIO_InitStructure.GPIO_Pin   = GPIO_Pin_1;         // 2. 逐项填写
GPIO_InitStructure.GPIO_Mode  = GPIO_Mode_Out_PP;
GPIO_InitStructure.GPIO_Speed = GPIO_Speed_50MHz;

GPIO_Init(GPIOA, &GPIO_InitStructure);              // 3. 把整张表交给库函数
\`\`\`

**这就是 STM32 编程最核心的套路，没有之一。** 后面你学 EXTI、TIM、NVIC、USART……全都是这个模式：

| 外设 | 结构体类型 | 初始化函数 |
|---|---|---|
| GPIO | [[GPIO_InitTypeDef]] | [[GPIO_Init()]] |
| EXTI | [[EXTI_InitTypeDef]] | [[EXTI_Init()]] |
| NVIC | [[NVIC_InitTypeDef]] | [[NVIC_Init()]] |
| TIM | [[TIM_TimeBaseInitTypeDef]] | [[TIM_TimeBaseInit()]] |
| 串口 | [[USART_InitTypeDef]] | [[USART_Init()]] |

看明白这个表，你就懂了 STM32 库函数的结构。

[h3] 为什么成员的名字这么长（GPIO_InitStructure.GPIO_Pin）

因为 Keil 有**代码补全**：你打 [[GPIO_InitStructure.]] 就会弹出所有成员名让你选。
**用补全，不要背。** 视频里老师也是这么敲的。

[h3] [[.]] 和 [[->]] 的区别

\`\`\`
StructName.x = 'A';          // 直接用变量名，用 .
pStructName->x = 'A';        // 用指针变量（地址），用 ->
\`\`\`

新手阶段你只需要知道：**看到 [[->]] 说明左边是一个地址（指针）**。
`},
{open:true, t:'5. 枚举 enum —— 起名字的整数',
 body:`
**用途：定义一个取值受限制的整型变量**，也是宏定义的集合。

\`\`\`
enum { FALSE = 0, TRUE = 1 } EnumName;

EnumName = FALSE;      // 取值只能是 FALSE 或 TRUE
\`\`\`

[h3] 在 STM32 里的例子

\`\`\`
typedef enum { DISABLE = 0, ENABLE = !DISABLE } FunctionalState;
\`\`\`

所以你写 [[RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOA, ENABLE);]] 里的 [[ENABLE]]，
本质上就是数字 1。写成 [[ENABLE]] 而不是 [[1]]，是为了让代码能读懂。

[h3] 库函数参数里的那些「_Type」是什么

\`\`\`
GPIO_InitStructure.GPIO_Mode = GPIO_Mode_Out_PP;   // GPIO_Mode_Out_PP 是一个枚举值
EXTI_InitStructure.EXTI_Trigger = EXTI_Trigger_Falling;
TIM_TimeBaseInitStructure.TIM_CounterMode = TIM_CounterMode_Up;
\`\`\`

它们都是**枚举常量**，每个都对应一个数字。你不需要知道数字是多少，
只需要知道**用哪个**——这就是查速查表的意义。

[warn] 填错枚举值编译器会报错（这是好事，说明编译器帮你检查了）；
但如果填了一个**语法正确但语义错误**的值（比如该用 Falling 用了 Rising），编译器不会报错，
现象是"中断不触发"。所以**速查表要对着看，别凭记忆。**
`},
{open:true, t:'6. 数组、for 循环、if、while',
 body:`
[h3] 数组 —— 一次存放多个同类型的值

\`\`\`
uint16_t pins[8] = {GPIO_Pin_0, GPIO_Pin_1, GPIO_Pin_2, GPIO_Pin_3,
                    GPIO_Pin_4, GPIO_Pin_5, GPIO_Pin_6, GPIO_Pin_7};

pins[0]   // 第一个元素（下标从 0 开始，不是 1！）
pins[7]   // 第八个元素
pins[-1]  // 错误！会读到乱七八糟的内存
pins[8]   // 错误！越界，数组只有 8 个元素
\`\`\`

[h3] for 循环 —— 重复做 n 次

\`\`\`
uint8_t i;
for (i = 0; i < 8; i++)     // i 从 0 开始；i 小于 8 就继续；每轮 i 加 1
{
    GPIO_ResetBits(GPIOA, pins[i]);   // i 依次取 0,1,2,...,7
    Delay_ms(200);
}
\`\`\`

**拆解：** [[for (初始化; 继续条件; 每轮之后执行)]]。三部分都懂，for 循环就懂了。

[h3] if —— 判断

\`\`\`
if (key == 0)              // 注意：判断相等是两个等号！
{
    LED_Toggle();
}
else if (key == 1)
{
    LED_Off();
}
else
{
    LED_On();
}
\`\`\`

[bad] **[[=]] 是赋值，[[==]] 是判断相等。** 写成 [[if (key = 0)]] 编译器可能只给个警告或完全不报错，
然后你的判断永远不成立——这是 C 语言最著名的坑。

[h3] while —— 条件成立就一直重复

\`\`\`
while (1)                        // 死循环：主程序的标准结尾
{
}

while (GPIO_ReadInputDataBit(GPIOB, GPIO_Pin_1) == 0);   // 等待松手：注意结尾的分号
\`\`\`

第二种写法在按键消抖里非常常用：**程序停在这里循环，直到按键松开为止**。
`},
{open:false, t:'7. ★ 指针 —— 只需要懂一个符号：&',
 body:`
提到指针大家就害怕。但在 STM32 入门阶段，**你只需要理解一件事**：

\`\`\`
GPIO_Init(GPIOA, &GPIO_InitStructure);
//              ↑ 这个 & 是什么？
\`\`\`

[h3] & 是「取地址」

- 变量 [[GPIO_InitStructure]] 是一个**盒子**，里面装着你的配置
- [[&GPIO_InitStructure]] 是这个盒子的**门牌号（地址）**
- 库函数 [[GPIO_Init()]] 需要的是**门牌号**，而不是盒子本身

**为什么？** 因为结构体很大（好几个字段），如果整个复制一份传进去，浪费内存和时间。
传地址的话，函数可以直接去那个地址读数据，效率高。

[h3] 记忆规则

| 你看到的写法 | 意思 | 什么时候用 |
|---|---|---|
| [[GPIOA]] | 端口名，本身就是一个地址 | 所有 GPIO 函数第一个参数 |
| [[&变量]] | 取这个变量的地址 | 所有 [[xxx_Init()]] 的第二个参数 |
| [[*指针]] | 取这个地址里存的值 | 读寄存器（[15-1] 会学到） |

[h3] 记住这一条就够了

\`\`\`
GPIO_Init(GPIOA, &GPIO_InitStructure);        // 结构体 → 要加 &
GPIO_SetBits(GPIOA, GPIO_Pin_1);              // 普通数字 → 不加 &
USART_Init(USART1, &USART_InitStructure);     // 结构体 → 要加 &
TIM_TimeBaseInit(TIM2, &TIM_TimeBaseInitStructure);
\`\`\`

**规律：参数是结构体变量，就加 [[&]]；参数是数字或常量，就不加。**
初期忘了加 [[&]]，编译器会报「参数类型不兼容」，照着提示加上就行。
`},
{open:false, t:'8. ★ 位运算 —— GPIO_Pin_0 | GPIO_Pin_1 什么意思',
 body:`
STM32 里到处是 [[|]]、[[&]]、[[~]]、[[<<]]，它们都是**位运算**，也就是"按二进制位一个一个地算"。

[h3] 四个运算符

| 运算符 | 名称 | 作用 |
|---|---|---|
| [[\\|]] | 按位或 | 两个位里**有一个是 1**，结果就是 1。用来**置位** |
| [[&]] | 按位与 | 两个位**都是 1**，结果才是 1。用来**取值/清零** |
| [[~]] | 按位取反 | 1 变 0，0 变 1。用来**构造掩码** |
| [[<<]] | 左移 | 整体向左挪 n 位。用来**构造位掩码** |

[h3] 理解 [[GPIO_Pin_0 | GPIO_Pin_1]]

\`\`\`
GPIO_Pin_0 = 0x0001 = 0000 0000 0000 0001
GPIO_Pin_1 = 0x0002 = 0000 0000 0000 0010
                     按位或 ↓
             0x0003 = 0000 0000 0000 0011   ← 第 0 位和第 1 位都是 1
\`\`\`

所以 [[GPIO_Pin_0 | GPIO_Pin_1]] 表示"同时操作 PA0 和 PA1"。
**这就是为什么 GPIO_Pin_x 的定义必须是 0x0001、0x0002、0x0004…… 每个引脚占一个二进制位。**

[h3] 典型用法

\`\`\`
// 同时开两个时钟（GPIOB 和 AFIO）
RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOB | RCC_APB2Periph_AFIO, ENABLE);

// 左移构造位掩码：1 << 3 = 0x0008 = 第 3 位是 1
uint16_t mask = 1 << 3;

// 用 & 判断某一位是不是 1
if (GPIO_ReadInputData(GPIOB) & GPIO_Pin_1) { /* PB1 是高电平 */ }
\`\`\`

[h3] 后面才会用到的两个复合运算符（先认识一下）

\`\`\`
reg |= 0x01;    // 等效于 reg = reg | 0x01;   置位（把某位置 1）
reg &= ~0x01;   // 等效于 reg = reg & (~0x01); 清零（把某位置 0）
\`\`\`

[ok] 为什么用这种写法？因为**直接改寄存器时，你只想改其中一位，不想影响其他位**。
这种"读—改—写"的位操作在整个嵌入式开发里随处可见，[15-1] 学 FLASH 时会大量出现。
`},
{open:false, t:'9. .h 和 .c 文件的关系',
 body:`
这是新手最困惑的问题之一：为什么每个外设都有两个文件？

| 文件 | 放什么 | 谁来用 |
|---|---|---|
| [[xxx.h]]（头文件） | **声明**：函数长什么样（名字、参数、返回值）、类型定义、宏定义 | 给别人 [[#include]] 用 |
| [[xxx.c]]（源文件） | **定义**：函数具体怎么实现的代码 | 被编译成机器码 |

[h3] 为什么要分开

假设没有头文件：你想用 [[GPIO_SetBits()]]，就得先自己写一遍 [[void GPIO_SetBits(...);]] 告诉编译器它存在。
有了 [[stm32f10x_gpio.h]]，你只要 [[#include "stm32f10x_gpio.h"]] 就全都有了。

[h3] 你自己的代码也应该这样组织

\`\`\`
// LED.h
#ifndef __LED_H                 // 防止重复包含（固定套路，照抄）
#define __LED_H
#include "stm32f10x.h"          // 用到 uint16_t 等类型，所以要包含
void LED_Init(void);            // 函数声明，以分号结尾
#endif

// LED.c
#include "LED.h"
void LED_Init(void)             // 函数定义，没有分号，后面直接跟函数体
{
    // 具体代码
}

// main.c
#include "LED.h"                // 包含头文件后就能用 LED_Init()
int main(void) { LED_Init(); while(1){} }
\`\`\`

[ok] 这就是视频里老师组织代码的方式：**每个模块一个 [[.h]] + 一个 [[.c]]**。
你在 [2-2] 建好的工程模板里，[[User]] 文件夹就是放这些文件的地方。
`},
{open:false, t:'10. 常见编译报错的中文对照表',
 body:`
Keil 的报错是英文的，新手看到一屏红字就慌了。其实**90% 的报错就这几种**：

| 报错关键词 | 真实原因 | 怎么修 |
|---|---|---|
| [[error: #5: cannot open source input file "xxx.h"]] | 找不到头文件 | Include Paths 里没加这个文件夹 |
| [[undefined symbol GPIO_Init]] (L6218E) | 函数找不到实现 | 对应的 [[.c]] 文件没加到工程分组里 |
| [[error: #20: identifier "xxx" is undefined]] | 变量或类型没有声明 | 拼错了，或者没 [[#include]] 对应头文件 |
| [[expected a ";"]] | 上一行少了分号 | 看**报错的上一行** |
| [[error: #147: declaration is incompatible]] | 参数类型不对 | 常见原因：结构体忘了加 [[&]] |
| [[warning: #223-D: function "xxx" declared implicitly]] | 用了未声明的函数 | 忘了 [[#include]] 头文件，**警告也要修，别忽略** |
| [[Error: Flash Download failed - "Cortex-M3"]] | 烧录失败 | 检查 ST-Link 接线、Debug 设置、芯片读保护 |

[h3] 排查顺序（照这个顺序走，能解决 95% 的问题）

1. **看第一个 error，不看最后一个。** 后面的报错往往是被第一个带出来的连锁反应
2. 报错行号如果是 [[main.c]] 里面的，看**这一行和上一行**
3. 如果是 [[.c]] 文件报 undefined，去工程左侧看**这个文件有没有被加进分组**
4. 全都不对，就回到 [2-2] 那六步，检查 Include Paths 和 Define

[warn] **一条铁律：先让"昨天能跑的代码"编译通过，再开始写今天的新代码。**
很多时间是被"改坏了回不去"浪费掉的。这也是为什么 Day 1 要你先建好一个**空模板**。
`}
];

/* ------------------------------------------------------------
   速查表
   ------------------------------------------------------------ */
const REF = [
{open:true, t:'★ 库函数通用套路（所有外设都长这样）',
 body:`
记住这五步，STM32 里任何一个外设的配置你都能看懂：

\`\`\`
1. 开时钟       RCC_APBxPeriphClockCmd(RCC_APBxPeriph_xxx, ENABLE);
2. 填结构体     xxx_InitTypeDef xxx_InitStructure;
                xxx_InitStructure.成员 = 值;
3. 初始化       xxx_Init(xxx, &xxx_InitStructure);
4. 配 NVIC      NVIC_InitTypeDef + NVIC_Init()      （需要中断时）
5. 使能         xxx_Cmd(xxx, ENABLE);               （定时器、串口等）
\`\`\`

[h3] 可复制的最小骨架

\`\`\`
#include "stm32f10x.h"

void My_Init(void)
{
    GPIO_InitTypeDef  GPIO_InitStructure;      // 需要几个就定义几个
    EXTI_InitTypeDef  EXTI_InitStructure;
    NVIC_InitTypeDef  NVIC_InitStructure;

    // 1. 开时钟
    RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOB | RCC_APB2Periph_AFIO, ENABLE);

    // 2. 配置 GPIO
    GPIO_InitStructure.GPIO_Pin   = GPIO_Pin_14;
    GPIO_InitStructure.GPIO_Mode  = GPIO_Mode_IPU;
    GPIO_InitStructure.GPIO_Speed = GPIO_Speed_50MHz;
    GPIO_Init(GPIOB, &GPIO_InitStructure);
}

int main(void)
{
    My_Init();
    while (1)
    {
    }
}
\`\`\`
`
},
{open:false, t:'GPIO 库函数速查',
 body:`
[h3] 开时钟（最容易忘）

\`\`\`
RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOA, ENABLE);   // A/B/C 和 AFIO 都在 APB2
RCC_APB2PeriphClockCmd(RCC_APB2Periph_AFIO,  ENABLE);   // 用 EXTI 时必须开
\`\`\`

[h3] 输出相关

| 函数 | 作用 |
|---|---|
| [[GPIO_SetBits(GPIOx, pin)]] | 引脚置 1（高电平） |
| [[GPIO_ResetBits(GPIOx, pin)]] | 引脚置 0（低电平） |
| [[GPIO_WriteBit(GPIOx, pin, Bit_SET/Bit_RESET)]] | 用一个函数搞定上面两个 |
| [[GPIO_Write(GPIOx, 0x0001)]] | 一次写整个端口 16 位 |
| [[GPIO_SetBits(GPIOA, GPIO_Pin_0 \\| GPIO_Pin_1)]] | 一次操作多个引脚 |

[h3] 输入相关

| 函数 | 作用 |
|---|---|
| [[GPIO_ReadInputDataBit(GPIOx, pin)]] | **读引脚真实电平**，返回 0 或 1 |
| [[GPIO_ReadInputData(GPIOx)]] | 读整个端口 16 位 |
| [[GPIO_ReadOutputDataBit(GPIOx, pin)]] | 读输出寄存器的值（不是引脚电平） |

[h3] 模式枚举值

| 枚举值 | 含义 |
|---|---|
| [[GPIO_Mode_AIN]] | 模拟输入（ADC 用） |
| [[GPIO_Mode_IN_FLOATING]] | 浮空输入 |
| [[GPIO_Mode_IPD]] | 下拉输入 |
| [[GPIO_Mode_IPU]] | **上拉输入（按键）** |
| [[GPIO_Mode_Out_OD]] | 开漏输出 |
| [[GPIO_Mode_Out_PP]] | **推挽输出（LED）** |
| [[GPIO_Mode_AF_OD]] | 复用开漏（I2C 用） |
| [[GPIO_Mode_AF_PP]] | **复用推挽（PWM / 串口 / SPI）** |

速度枚举：[[GPIO_Speed_10MHz]]、[[GPIO_Speed_2MHz]]、[[GPIO_Speed_50MHz]]
`
},
{open:false, t:'EXTI / NVIC 速查 + 中断通道对照表',
 body:`
[h3] EXTI 配置五要素

\`\`\`
RCC_APB2PeriphClockCmd(RCC_APB2Periph_GPIOB | RCC_APB2Periph_AFIO, ENABLE); // 别忘了 AFIO
GPIO_EXTILineConfig(GPIO_PortSourceGPIOB, GPIO_PinSource14);               // 引脚 → EXTI 线

EXTI_InitStructure.EXTI_Line    = EXTI_Line14;
EXTI_InitStructure.EXTI_Mode    = EXTI_Mode_Interrupt;    // Interrupt 中断 / Event 事件
EXTI_InitStructure.EXTI_Trigger = EXTI_Trigger_Falling;   // Rising/Falling/Rising_Falling
EXTI_InitStructure.EXTI_LineCmd = ENABLE;
EXTI_Init(&EXTI_InitStructure);
\`\`\`

[h3] 触发方式

| 枚举值 | 含义 | 典型场景 |
|---|---|---|
| [[EXTI_Trigger_Rising]] | 上升沿（低→高） | 按键松手 |
| [[EXTI_Trigger_Falling]] | 下降沿（高→低） | **按键按下、传感器遮挡** |
| [[EXTI_Trigger_Rising_Falling]] | 双边沿 | 编码器 A/B 相 |

[h3] ★ 中断通道号与中断函数名对照（最容易写错）

| EXTI 线路 | NVIC 通道枚举 | 中断函数名 |
|---|---|---|
| Line0 | [[EXTI0_IRQn]] | [[EXTI0_IRQHandler()]] |
| Line1 | [[EXTI1_IRQn]] | [[EXTI1_IRQHandler()]] |
| Line2 | [[EXTI2_IRQn]] | [[EXTI2_IRQHandler()]] |
| Line3 | [[EXTI3_IRQn]] | [[EXTI3_IRQHandler()]] |
| Line4 | [[EXTI4_IRQn]] | [[EXTI4_IRQHandler()]] |
| Line5~9 | [[EXTI9_5_IRQn]] | [[EXTI9_5_IRQHandler()]] |
| **Line10~15** | **[[EXTI15_10_IRQn]]** | **[[EXTI15_10_IRQHandler()]]** |

[warn] **没有 [[EXTI14_IRQn]] 这个东西！** 线路 10~15 共用一个通道。
写了不存在的函数名，代码不报错但中断永远不触发。

[h3] 中断函数标准写法

\`\`\`
void EXTI15_10_IRQHandler(void)
{
    if (EXTI_GetITStatus(EXTI_Line14) == SET)     // 判断具体是哪条线
    {
        // 干活

        EXTI_ClearITPendingBit(EXTI_Line14);      // ★ 必须清除标志
    }
}
\`\`\`

[h3] NVIC 优先级

\`\`\`
NVIC_PriorityGroupConfig(NVIC_PriorityGroup_2);   // 工程里设置一次即可

NVIC_InitStructure.NVIC_IRQChannel = EXTI15_10_IRQn;
NVIC_InitStructure.NVIC_IRQChannelPreemptionPriority = 1;   // 抢占优先级
NVIC_InitStructure.NVIC_IRQChannelSubPriority        = 1;   // 响应优先级
NVIC_InitStructure.NVIC_IRQChannelCmd = ENABLE;
NVIC_Init(&NVIC_InitStructure);
\`\`\`

| 分组 | 抢占优先级范围 | 响应优先级范围 |
|---|---|---|
| Group_0 | 无 | 0~15 |
| Group_1 | 0~1 | 0~7 |
| **Group_2** | **0~3** | **0~3** |
| Group_3 | 0~7 | 0~1 |
| Group_4 | 0~15 | 无 |

**优先级数字越小 = 优先级越高。**
`
},
{open:false, t:'TIM 定时器速查 + 参数计算',
 body:`
[h3] 时钟与总线

\`\`\`
RCC_APB2PeriphClockCmd(RCC_APB2Periph_TIM1, ENABLE);   // TIM1 在 APB2
RCC_APB1PeriphClockCmd(RCC_APB1Periph_TIM2, ENABLE);   // TIM2/3/4 在 APB1
\`\`\`

[h3] 时基单元配置

\`\`\`
TIM_InternalClockConfig(TIM2);                                  // 内部时钟（默认）
TIM_TimeBaseInitStructure.TIM_ClockDivision     = TIM_CKD_DIV1;
TIM_TimeBaseInitStructure.TIM_CounterMode       = TIM_CounterMode_Up;
TIM_TimeBaseInitStructure.TIM_Period            = 10000 - 1;    // ARR
TIM_TimeBaseInitStructure.TIM_Prescaler         = 7200  - 1;    // PSC
TIM_TimeBaseInitStructure.TIM_RepetitionCounter = 0;
TIM_TimeBaseInit(TIM2, &TIM_TimeBaseInitStructure);

TIM_ClearFlag(TIM2, TIM_FLAG_Update);          // 清掉初始化时的更新标志
TIM_ITConfig(TIM2, TIM_IT_Update, ENABLE);     // 使能更新中断
TIM_Cmd(TIM2, ENABLE);                         // ★ 启动定时器
\`\`\`

[h3] ★ 频率公式

\`\`\`
中断频率 = 72,000,000 / (PSC + 1) / (ARR + 1)      // TIM2~TIM4 输入时钟 72MHz
定时时间 = 1 / 中断频率
\`\`\`

[h3] 常用参数对照

| 想要的周期 | PSC | ARR | 中断频率 |
|---|---|---|---|
| 1 秒 | 7200-1 (7199) | 10000-1 (9999) | 1 Hz |
| 0.5 秒 | 7200-1 | 5000-1 | 2 Hz |
| 0.1 秒 | 7200-1 | 1000-1 | 10 Hz |
| 1 毫秒 | 72-1 | 1000-1 | 1000 Hz |
| 10 微秒 | 72-1 | 10-1 | 100 kHz |

**推导方法：先把 72000000 拆成 7200 × 10000，7200 给 PSC，剩下的给 ARR。**

[h3] 外部时钟（ETR）

\`\`\`
TIM_ETRClockMode2Config(TIM2, TIM_ExtTRGPSC_OFF,
                        TIM_ExtTRGPolarity_NonInverted, 0x0F);
// 替代 TIM_InternalClockConfig()，之后 ETR 引脚每来一个脉冲 CNT 加 1
\`\`\`

[h3] 中断函数

\`\`\`
void TIM2_IRQHandler(void)
{
    if (TIM_GetITStatus(TIM2, TIM_IT_Update) == SET)
    {
        // 干活
        TIM_ClearITPendingBit(TIM2, TIM_IT_Update);   // ★ 必须清
    }
}
\`\`\`
`
},

\`\`\`
ST-Link          STM32 核心板
3.3V  ────────  3V3

SWDIO ────────  PA13 (SWDIO)

<script>
/* ============================================================
   STM32 五天速通学习器 —— 单文件离线学习 App
   数据（PLAN / COURSES / CSURV / REF / QUIZ）内联在上方 script
   ============================================================ */

/* ---------- 轻量标记渲染 ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function md(src){
  const lines = src.split('\n');
  let out=[], i=0, inCode=false;
  const inline = t => esc(t)
    .replace(/\\\|/g,'|')
    .replace(/\[\[([^\]]+)\]\]/g,'<code>$1</code>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  while(i<lines.length){
    const L=lines[i];
    if(/^```/.test(L) || /^\[\[\[[a-z0-9]*\]?\s*$/.test(L)){   // 代码块（``` 或 [[[c] ... ]]）
      let buf=[], open = /^\[\[\[/.test(L); i++;
      while(i<lines.length && !(open?/^\s*\]\]+\s*$/.test(lines[i]):/^```/.test(lines[i]))) buf.push(lines[i++]);
      i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>'); continue;
    }
    if(/^\|/.test(L)){                        // 表格
      let rows=[];
      while(i<lines.length && /^\|/.test(lines[i])){
        const raw=lines[i].replace(/\\\|/g,'\u0000');          // 保护转义竖线 \|
        const cells=raw.replace(/^\||\|$/g,'').split('|').map(c=>c.trim().replace(/\u0000/g,'|'));
        if(!/^[\s\-:|]+$/.test(lines[i].replace(/\|/g,''))) rows.push(cells);
        i++;
      }
      if(rows.length){
        let h='<table>';
        rows.forEach((r,ri)=>{
          h+='<tr>'+(ri===0?'<th>':'<td>')+r.map(c=>inline(c)).join(ri===0?'</th><th>':'</td><td>')+(ri===0?'</th>':'</td>')+'</tr>';
        });
        out.push(h+'</table>');
      }
      continue;
    }
    if(/^#{2,4}\s/.test(L) || /^\[h[2-4]\]\s/.test(L)){   // 标题（## / [h3] 两种写法）
      const lv = /^\[h/.test(L) ? +L.match(/^\[h(\d)\]/)[1] : L.match(/^#+/)[0].length;
      out.push('<h'+lv+'>'+inline(L.replace(/^(#+\s*|\[h[2-4]\]\s*)/,''))+'</h'+lv+'>'); i++; continue;
    }
    if(/^>\s?/.test(L) || /^\[(warn|ok|bad)\]\s*/.test(L)){   // 引用块（> ... 或裸 [warn]/[ok]/[bad]）
      let buf=[], kind='';
      const isQ = s => /^>/.test(s) || /^\[(warn|ok|bad)\]\s*/.test(s);
      const stripQ = s => s.replace(/^>\s?/,'').replace(/^\[(warn|ok|bad)\]\s*/,'');
      while(i<lines.length && isQ(lines[i])){
        const s=lines[i];
        const m = s.match(/^>\s?\[(warn|ok|bad)\]/) || s.match(/^\[(warn|ok|bad)\]/);
        if(m) kind = m[1];
        buf.push(stripQ(s)); i++;
      }
      out.push('<blockquote'+(kind?' class="'+kind+'"':'')+'>'+md(buf.join('\n'))+'</blockquote>'); continue;
    }
    if(/^\s*(-|\d+\.)\s/.test(L)){            // 列表
      const ordered=/^\s*\d+\./.test(L);
      let buf=[];
      while(i<lines.length && /^\s*(-|\d+\.)\s/.test(lines[i])) buf.push(lines[i++]);
      out.push('<'+ (ordered?'ol':'ul') +'>'+buf.map(b=>'<li>'+inline(b.replace(/^\s*(-|\d+\.)\s*/,''))+'</li>').join('')+'</'+(ordered?'ol':'ul')+'>');
      continue;
    }
    if(/^\s*$/.test(L)){ i++; continue; }
    let buf=[];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|\[\[\[)/.test(lines[i]) && !/^\[(warn|ok|bad)\]/.test(lines[i]) && !/^\s*(-|\d+\.)\s/.test(lines[i])) buf.push(lines[i++]);
    out.push('<p>'+buf.map(inline).join(' ')+'</p>');
  }
  return out.join('');
}

/* ---------- 进度存储 ---------- */
const KEY='stm32-5d-progress-v1';
let STORE={};
try{ STORE=JSON.parse(localStorage.getItem(KEY)||'{}')||{} }catch(e){ STORE={} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(STORE)) }catch(e){} }
function isDone(id){ return !!STORE[id] }
function toggle(id){ STORE[id]=!STORE[id]; if(!STORE[id]) delete STORE[id]; save(); refreshAll() }

/* ---------- 渲染：计划 ---------- */
function planTaskHTML(t){
  const done=isDone(t.id);
  return '<label class="task'+(done?' done':'')+'" data-task="'+t.id+'">'
    +'<input type="checkbox" data-task="'+t.id+'"'+(done?' checked':'')+'>'
    +'<span class="tt">'+esc(t.t)
    +(t.s?'<small>'+esc(t.s)+'</small>':'')
    +(t.tags&&t.tags.length?'<span class="tags">'+t.tags.map(g=>'<span class="tag '+g.k+'">'+esc(g.n)+'</span>').join('')+'</span>':'')
    +'</span></label>';
}
function renderPlan(){
  let h='<div class="card"><h2>怎么用这个 App</h2>'
    +md('每天点开 **计划** 页，把当天的任务挨个打勾；任务里的 `[视频]` 标签是 B 站分 P，直接点开看。\n'
      +'看视频时先别急着写代码，**看完一集就用「课程」页的详解复习一遍**，再回去手动敲代码。\n'
      +'进度存在手机本地，换页面、关浏览器都不会丢。')
    +'</div>';
  PLAN.forEach(d=>{
    const total=d.tasks.length, done=d.tasks.filter(t=>isDone(t.id)).length;
    h+='<div class="day'+(done===total?' done':'')+' open" data-day="'+d.id+'">'
      +'<div class="day-h" data-dayh="'+d.id+'">'
      +'<span class="no">'+d.no+'</span>'
      +'<span class="t"><b>'+esc(d.title)+'</b><span>'+esc(d.sub)+'</span></span>'
      +'<span class="pct">'+done+'/'+total+'</span></div>'
      +'<div class="day-b"><div class="goal">'+md(d.goal)+'</div>'
      +d.tasks.map(planTaskHTML).join('')
      +'</div></div>';
  });
  document.getElementById('v-plan').innerHTML=h;
}

/* ---------- 渲染：课程 ---------- */
let curTopic=0;
function renderCourse(){
  let tabs='<div id="topics">';
  COURSES.forEach((c,i)=>{
    tabs+='<button data-topic="'+i+'"'+(i===curTopic?' class="on"':'')+'>'+esc(c.p)+' '+esc(c.short)+'</button>';
  });
  tabs+='</div>';
  let body='';
  COURSES.forEach((c,i)=>{
    if(i!==curTopic) return;
    c.items.forEach(it=>{
      const done=isDone(it.id);
      body+='<div class="read'+(done?' done':'')+' open" data-read="'+it.id+'">'
        +'<div class="read-h" data-readh="'+it.id+'">'
        +'<span class="no">'+esc(c.p)+'-'+esc(it.no)+'</span>'
        +'<b>'+esc(it.t)+'</b>'
        +'<span class="ck">'+(done?'✅ 已复习':'○ 未复习')+'</span></div>'
        +'<div class="read-b">'
        +(c.link?'<div class="meta"><a href="'+c.link+'" target="_blank">▶ 打开这一集视频（B 站 P'+(c.link.split('p=')[1])+'）</a></div>':'')
        +md(it.body)
        +'<div class="meta"><button class="btn smk" data-toq="'+it.id+'">标记为已复习</button></div>'
        +'</div></div>';
    });
  });
  document.getElementById('v-course').innerHTML=tabs+'<div class="read-list">'+body+'</div>';
}
function renderC(){
  let h='';
  CSURV.forEach(g=>{
    h+='<details class="fold"'+(g.open?' open':'')+'><summary>'+esc(g.t)+'</summary><div>'+md(g.body)+'</div></details>';
  });
  document.getElementById('v-c').innerHTML=h;
}
function renderRef(){
  let h='<input class="search" id="refq" placeholder="搜索：GPIO / 定时器 / 中断 …">';
  h+='<div id="reflist">';
  REF.forEach(g=>{ h+=refCard(g) });
  h+='</div>';
  document.getElementById('v-ref').innerHTML=h;
  document.getElementById('refq').addEventListener('input',e=>{
    const q=e.target.value.trim().toLowerCase();
    const list=REF.filter(g=>!q || (g.t+' '+g.body).toLowerCase().includes(q));
    document.getElementById('reflist').innerHTML = list.length? list.map(refCard).join('') : '<p style="color:var(--fg3)">没找到，换个关键词试试。</p>';
  });
}
function refCard(g){
  return '<details class="fold"'+(g.open?' open':'')+'><summary>'+esc(g.t)+'</summary><div>'+md(g.body)+'</div></details>';
}

/* ---------- 渲染：自测 ---------- */
let quizState={};
function renderQuiz(){
  const answered=Object.keys(quizState).length;
  const right=Object.values(quizState).filter(v=>v.right).length;
  let h='<p class="score">已答 '+answered+' / '+QUIZ.length+' 题'+(answered?'　正确 '+right+'（'+Math.round(right/answered*100)+'%）':'')
    +(answered?'<button class="btn ghost smk" id="resetq" style="margin-left:8px">重做</button>':'')+'</p>';
  QUIZ.forEach((q,qi)=>{
    const st=quizState[qi];
    h+='<div class="q"><div class="stem"><span class="no">Q'+(qi+1)+'</span>'+md(q.q).replace(/^<p>|<\/p>$/g,'')+'</div>';
    q.o.forEach((o,oi)=>{
      let cls='opt';
      if(st){ if(oi===q.a) cls+=' ok'; else if(oi===st.pick) cls+=' bad'; }
      h+='<button class="'+cls+'" data-q="'+qi+'" data-o="'+oi+'">'+esc(o)+'</button>';
    });
    h+='<div class="exp'+(st?' on':'')+'"><b>正确答案：'+'ABCD'[q.a]+'　</b>'+md(q.e).replace(/^<p>|<\/p>$/g,'')+'</div></div>';
  });
  document.getElementById('v-quiz').innerHTML=h;
  const rb=document.getElementById('resetq');
  if(rb) rb.onclick=()=>{ quizState={}; renderQuiz() };
}

/* ---------- 进度统计 ---------- */
function refreshAll(){
  const ids=[];
  PLAN.forEach(d=>d.tasks.forEach(t=>ids.push(t.id)));
  COURSES.forEach(c=>c.items.forEach(t=>ids.push(t.id)));
  const done=ids.filter(isDone).length;
  const pct=ids.length? Math.round(done/ids.length*100):0;
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('overall').textContent=pct+'%';
}

/* ---------- 事件 ---------- */
document.querySelector('nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]'); if(!b) return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  if(b.dataset.v==='quiz') renderQuiz();
  if(b.dataset.v==='course') renderCourse();
  window.scrollTo(0,0);
});
document.body.addEventListener('click',e=>{
  const t=e.target;
  if(t.matches('header .hd h1')){ window.scrollTo(0,0); return }
  const dh=t.closest('[data-dayh]');
  if(dh){ const d=dh.closest('.day'); d.classList.toggle('open'); return }
  const rh=t.closest('[data-readh]');
  if(rh){ const r=rh.closest('.read'); r.classList.toggle('open'); return }
  const tp=t.closest('#topics button[data-topic]');
  if(tp){ curTopic=+tp.dataset.topic; renderCourse(); return }
  const toq=t.closest('[data-toq]');
  if(toq){ toggle(toq.dataset.toq); renderCourse(); toast(isDone(toq.dataset.toq)?'已标记复习完成':'已取消'); return }
  const qo=t.closest('button[data-q]');
  if(qo){
    const qi=+qo.dataset.q, oi=+qo.dataset.o;
    if(quizState[qi]) return;
    quizState[qi]={pick:oi,right:oi===QUIZ[qi].a};
    renderQuiz();
    const el=document.querySelectorAll('.q')[qi]; if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});
    return;
  }
});
document.body.addEventListener('change',e=>{
  const c=e.target.closest('input[type=checkbox][data-task]');
  if(c){ toggle(c.dataset.task) }
});
let toastT;
function toast(m){
  const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1400);
}

/* ---------- 启动 ---------- */
renderPlan(); renderCourse(); renderC(); renderRef(); renderQuiz(); refreshAll();

/* ---------- 离线支持：注册 Service Worker ----------
   生效于 https（GitHub Pages）以及 localhost（本地测试）。
   file:// 与 http://内网IP 下浏览器不允许注册 SW，
   那种情况本身已是本地文件，不需要联网，所以自动跳过即可。 */
if('serviceWorker' in navigator &&
   (location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname))){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
